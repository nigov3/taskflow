<body>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

/* =====================================================================
   ПОДКЛЮЧЕНИЕ К  (серверная авторизация + общая база)
   ---------------------------------------------------------------------
   1. Зарегистрируйтесь бесплатно на https://.com и создайте проект.
   2. В проекте: Settings -> API — скопируйте Project URL и anon public key.
   3. Вставьте их вместо XXX ниже. Всё — приложение само переключится
      в «командный режим»: вход по email/паролю, общие данные для всех.
   4. SQL-скрипт для создания таблиц и правил доступа лежит в файле
      -schema.sql (вкладка SQL Editor в ).
   Пока строки не заменены — работает локальный режим (данные в браузере).
   ===================================================================== */
const SUPABASE_URL = 'https://kuprepaapdmtmdzrhrsr..co';      // например: 'https://abcdefgh..co'
const SUPABASE_KEY = 'sb_publishable_Cq96flz1UZC-Yb371EcMDg_EMsgaItz';      // anon public key из Settings -> API
const useSupabase = !!(window.supabase && SUPABASE_URL !== 'https://kuprepaapdmtmdzrhrsr.supabase.co' && SUPABASE_KEY !== 'sb_publishable_Cq96flz1UZC-Yb371EcMDg_EMsgaItz'
                       && /^https:\/\/.+/i.test(SUPABASE_URL));
const sb = useSupabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

// Загрузка/сохранение общих данных (tasks, members) с деградацией:
// есть Supabase — работаем с общей базой; нет — с localStorage.
async function loadShared(key, fallback) {
  if (sb) {
    const { data, error } = await sb.from('app_state').select('value').eq('id', key).maybeSingle();
    if (!error && data) return data.value;
  }
  try { const d = localStorage.getItem(key); return d ? JSON.parse(d) : fallback; } catch { return fallback; }
}
async function saveShared(key, value) {
  localStorage.setItem(key, JSON.stringify(value)); // локальная копия — на случай офлайна
  if (sb) await sb.from('app_state').upsert({ id: key, value, updated_at: new Date().toISOString() });
}

const STATUS_CONFIG = {
  todo: { label: 'К выполнению', icon: '📋', colClass: 'col-todo' },
  in_progress: { label: 'В работе', icon: '🔄', colClass: 'col-progress' },
  review: { label: 'На проверке', icon: '🔍', colClass: 'col-review' },
  done: { label: 'Готово', icon: '✅', colClass: 'col-done' },
};

const PRIORITY_CONFIG = {
  low: { label: 'Низкий', class: 'priority-low' },
  medium: { label: 'Средний', class: 'priority-medium' },
  high: { label: 'Высокий', class: 'priority-high' },
  urgent: { label: 'Срочный', class: 'priority-urgent' },
};

const DEFAULT_MEMBERS = [
  { id: '1', name: 'Александр', avatar: '👨‍💻', role: 'Разработчик' },
  { id: '2', name: 'Мария', avatar: '👩‍🎨', role: 'Дизайнер' },
  { id: '3', name: 'Дмитрий', avatar: '👨‍💼', role: 'Менеджер' },
  { id: '4', name: 'Елена', avatar: '👩‍💻', role: 'Тестировщик' },
];

// Простое хеширование пароля (SHA-256), чтобы не хранить пароль в открытом виде.
// Соль уникальна для каждого браузера: она генерируется один раз и хранится локально,
// поэтому даже одинаковые пароли на разных устройствах дают разные хеши.
function getSalt() {
  let salt = localStorage.getItem('tf_salt');
  if (!salt) {
    salt = Array.from(crypto.getRandomValues(new Uint8Array(16)))
      .map(b => b.toString(16).padStart(2, '0')).join('');
    localStorage.setItem('tf_salt', salt);
  }
  return salt;
}

async function hashPassword(pw) {
  const input = getSalt() + ':' + pw;
  if (window.isSecureContext && navigator.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(input));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  // Фолбэк для окружений без SubtleCrypto (открыт как файл или по HTTP):
  // детерминированный хеш на основе FNV-1a — лучше, чем пароль в открытом виде,
  // но слабее SHA-256. Для настоящей защиты используйте серверную авторизацию.
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for (let i = 0; i < input.length; i++) {
    h1 = Math.imul(h1 ^ input.charCodeAt(i), 16777619) >>> 0;
    h2 = Math.imul(h2 + input.charCodeAt(i), 2246822519) >>> 0;
  }
  return 'fb' + h1.toString(36) + h2.toString(36);
}

function loadData(key, fallback) {
  try { const d = localStorage.getItem(key); return d ? JSON.parse(d) : fallback; } catch { return fallback; }
}

function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }

function formatDate(d) {
  if (!d) return '';
  return new Date(d).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
}

function isOverdue(d) {
  if (!d) return false;
  const dl = new Date(d); const today = new Date(); today.setHours(0,0,0,0);
  return dl < today;
}

function isDueSoon(d) {
  if (!d) return false;
  const dl = new Date(d); const today = new Date(); today.setHours(0,0,0,0);
  const diff = (dl - today) / (1000*60*60*24);
  return diff >= 0 && diff <= 3;
}

function App() {
  const [tasks, setTasks] = useState(() => loadData('tf_tasks', []));
  const [members, setMembers] = useState(() => loadData('tf_members', DEFAULT_MEMBERS));
  const [modalOpen, setModalOpen] = useState(false);
  const [editingTask, setEditingTask] = useState(null);
  const [defaultStatus, setDefaultStatus] = useState('todo');
  const [filterAssignee, setFilterAssignee] = useState('');
  const [filterPriority, setFilterPriority] = useState('');
  const [searchQuery, setSearchQuery] = useState('');
  const [showTeam, setShowTeam] = useState(false);
  const [newName, setNewName] = useState('');
  const [newRole, setNewRole] = useState('');
  const [viewMode, setViewMode] = useState('kanban');

  // --- Аутентификация и права ---
  // Локальный режим: владелец один, пароль хранится как SHA-256 хеш в браузере.
  // Режим Supabase: вход по email/паролю через сервер, роль owner закреплена
  // в таблице profiles — сменить её может только владелец (проверяется на сервере).
  const [ownerAccount, setOwnerAccount] = useState(() => loadData('tf_owner', null)); // { name, passHash }
  const [currentUser, setCurrentUser] = useState(() => loadData('tf_session', null)); // { name, role: 'owner' | 'member' }
  const [loginOpen, setLoginOpen] = useState(false);
  const [loginName, setLoginName] = useState('');
  const [loginPass, setLoginPass] = useState('');
  const [loginError, setLoginError] = useState('');
  const [setupName, setSetupName] = useState('');
  const [setupPass, setSetupPass] = useState('');
  const [setupPass2, setSetupPass2] = useState('');
  const [setupError, setSetupError] = useState('');
  // Supabase-состояние
  const [sbReady, setSbReady] = useState(!useSupabase);
  const [sbUser, setSbUser] = useState(null);        // объект пользователя Supabase
  const [sbProfile, setSbProfile] = useState(null);  // { id, name, role }
  const [authMode, setAuthMode] = useState('login'); // 'login' | 'register' — для входа сотрудников
  const [regName, setRegName] = useState('');

  const isOwner = useSupabase
    ? !!(sbProfile && sbProfile.role === 'owner')
    : !!(currentUser && currentUser.role === 'owner');
  const displayName = useSupabase
    ? (sbProfile ? sbProfile.name : (sbUser ? sbUser.email : ''))
    : (currentUser ? currentUser.name : '');
  // В командном режиме доступ «на замок»: данные видны только тем, кому
  // владелец выдал роль (member/editor/owner). pending = ждёт одобрения.
  const approved = useSupabase ? !!(sbProfile && ['owner', 'editor', 'member'].includes(sbProfile.role)) : true;
  const isPending = useSupabase && !!sbProfile && sbProfile.role === 'pending';
  const loggedIn = useSupabase ? (!!sbUser && approved) : !!currentUser;
  // Писать общие данные могут владелец и редакторы (и в локальном режиме — только владелец).
  const canEditTasks = useSupabase
    ? !!(sbProfile && ['owner', 'editor'].includes(sbProfile.role))
    : isOwner;

  // Загрузка общих данных + подписка на изменения (реальное время)
  useEffect(() => {
    let cancelled = false;
    if (useSupabase && !loggedIn) return () => {}; // доступ не выдан — данные не грузим
    (async () => {
      const t = await loadShared('tf_tasks', []);
      const m = await loadShared('tf_members', DEFAULT_MEMBERS);
      if (!cancelled) { setTasks(t); setMembers(m); }
    })();
    if (sb) {
      const channel = sb.channel('app_state_changes')
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_state' },
          (payload) => {
            const v = payload.new && payload.new.value;
            if (payload.new.id === 'tf_tasks' && Array.isArray(v)) setTasks(v);
            if (payload.new.id === 'tf_members' && Array.isArray(v)) setMembers(v);
          })
        .subscribe();
      return () => { cancelled = true; sb.removeChannel(channel); };
    }
    return () => { cancelled = true; };
  }, [loggedIn]);

  // Сохранение общих данных (в Supabase пишет владелец/редактор — так решают RLS-политики)
  useEffect(() => {
    localStorage.setItem('tf_tasks', JSON.stringify(tasks));
    if (sb && canEditTasks) saveShared('tf_tasks', tasks);
  }, [tasks, canEditTasks]);
  useEffect(() => {
    localStorage.setItem('tf_members', JSON.stringify(members));
    if (sb && canEditTasks) saveShared('tf_members', members);
  }, [members, canEditTasks]);

  useEffect(() => { if (ownerAccount) localStorage.setItem('tf_owner', JSON.stringify(ownerAccount)); }, [ownerAccount]);
  // Миграция со старых схем: tf_admin -> tf_owner (сброс сессии, т.к. хеш теперь с новой солью),
  // сессия isAdmin -> role:'owner'
  useEffect(() => {
    const legacyAdmin = loadData('tf_admin', null);
    if (!ownerAccount && legacyAdmin) setOwnerAccount(legacyAdmin);
    if (legacyAdmin) localStorage.removeItem('tf_admin');
    if (currentUser && currentUser.isAdmin !== undefined) {
      setCurrentUser({ name: currentUser.name, role: currentUser.isAdmin ? 'owner' : 'member' });
    }
  }, []);
  useEffect(() => { localStorage.setItem('tf_session', JSON.stringify(currentUser)); }, [currentUser]);

  // --- Supabase: сессия и профиль ---
  useEffect(() => {
    if (!sb) return;
    let mounted = true;
    async function fetchProfile(userId) {
      const { data: prof } = await sb.from('profiles').select('*').eq('id', userId).maybeSingle();
      if (!mounted) return;
      // Профиль создаёт серверный триггер при регистрации. Если его почему-то
      // нет — считаем человека неодобренным (pending), доступ закрыт.
      setSbProfile(prof || { id: userId, name: '', role: 'pending' });
      // Обновляем список профилей для панели «Доступ» (виден только владельцу)
      const { data: all } = await sb.from('profiles').select('*');
      if (mounted && all) setProfiles(all);
      setSbReady(true);
    }
    sb.auth.getSession().then(({ data: { session } }) => {
      if (!mounted) return;
      setSbUser(session ? session.user : null);
      if (session) fetchProfile(session.user.id); else setSbReady(true);
    });
    const { data: sub } = sb.auth.onAuthStateChange((_event, session) => {
      const u = session ? session.user : null;
      setSbUser(u);
      if (u) fetchProfile(u.id); else { setSbProfile(null); setSbReady(true); }
    });
    return () => { mounted = false; if (sub && sub.subscription) sub.subscription.unsubscribe(); };
  }, []);

  const requireAdmin = (action) => {
    if (!isOwner) { alert(`Действие доступно только владельцу: ${action}`); return false; }
    return true;
  };

  const setupAdmin = async () => {
    if (ownerAccount) return;
    if (!setupName.trim() || setupPass.length < 4) { setSetupError('Укажите имя и пароль не короче 4 символов'); return; }
    if (setupPass !== setupPass2) { setSetupError('Пароли не совпадают'); return; }
    const passHash = await hashPassword(setupPass);
    setOwnerAccount({ name: setupName.trim(), passHash });
    setCurrentUser({ name: setupName.trim(), role: 'owner' });
    setSetupName(''); setSetupPass(''); setSetupPass2(''); setSetupError('');
  };

  const doLogin = async () => {
    if (useSupabase) {
      setLoginError('');
      const { error } = await sb.auth.signInWithPassword({ email: loginName.trim(), password: loginPass });
      if (error) { setLoginError('Неверный email или пароль'); return; }
      setLoginOpen(false); setLoginName(''); setLoginPass('');
      return;
    }
    if (!ownerAccount) return;
    const passHash = await hashPassword(loginPass);
    if (loginName.trim() === ownerAccount.name && passHash === ownerAccount.passHash) {
      setCurrentUser({ name: ownerAccount.name, role: 'owner' });
      setLoginOpen(false); setLoginName(''); setLoginPass(''); setLoginError('');
    } else {
      setLoginError('Неверное имя или пароль');
    }
  };

  const doRegister = async () => {
    setLoginError('');
    if (regName.trim().length < 2) { setLoginError('Укажите имя (минимум 2 символа)'); return; }
    if (loginPass.length < 6) { setLoginError('Пароль должен быть не короче 6 символов'); return; }
    const { data, error } = await sb.auth.signUp({
      email: loginName.trim(),
      password: loginPass,
      options: { data: { name: regName.trim() } } // имя попадёт в профиль через триггер
    });
    if (error) { setLoginError(error.message); return; }
    // Профиль создаётся серверным триггером автоматически.
    // Если Supabase настроен без подтверждения email — пользователь уже вошёл
    // и увидит экран «доступ ещё не выдан».
    if (data.session) {
      setLoginOpen(false); setLoginName(''); setLoginPass(''); setRegName('');
    } else {
      setLoginError('✅ Аккаунт создан! Проверьте почту и подтвердите адрес, затем войдите.');
      setAuthMode('login'); setLoginPass('');
    }
  };

  const logout = () => {
    if (useSupabase) { sb.auth.signOut(); return; }
    setCurrentUser(null);
  };

  const changeUserRole = async (profileId, role) => {
    if (!requireAdmin('изменение роли доступа')) return;
    const { error } = await sb.from('profiles').update({ role }).eq('id', profileId);
    if (error) { alert('Сервер отклонил изменение роли: ' + error.message); return; }
    const { data } = await sb.from('profiles').select('*');
    if (data) setProfiles(data);
    // Если изменили роль самому себе — обновляем и свой профиль
    if (sbUser && profileId === sbUser.id) {
      const me = (data || []).find(p => p.id === sbUser.id);
      if (me) setSbProfile(me);
    }
  };

  const removeProfile = async (profileId, name) => {
    if (!requireAdmin('отзыв доступа')) return;
    if (!confirm(`Отозвать доступ у «${name}»? Человек больше не сможет войти.`)) return;
    const { error } = await sb.from('profiles').delete().eq('id', profileId);
    if (error) { alert('Не удалось отозвать доступ: ' + error.message); return; }
    const { data } = await sb.from('profiles').select('*');
    if (data) setProfiles(data);
  };

  const [profiles, setProfiles] = useState([]);
  useEffect(() => {
    if (!sb || !isOwner) return;
    let mounted = true;
    sb.from('profiles').select('*').then(({ data }) => { if (mounted && data) setProfiles(data); });
    return () => { mounted = false; };
  }, [sbUser, isOwner]);

  const filtered = useMemo(() => tasks.filter(t => {
    if (filterAssignee && t.assignee !== filterAssignee) return false;
    if (filterPriority && t.priority !== filterPriority) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      return t.title.toLowerCase().includes(q) || t.description.toLowerCase().includes(q);
    }
    return true;
  }), [tasks, filterAssignee, filterPriority, searchQuery]);

  const stats = useMemo(() => ({
    total: tasks.length,
    done: tasks.filter(t => t.status === 'done').length,
    overdue: tasks.filter(t => t.deadline && t.status !== 'done' && isOverdue(t.deadline)).length,
    inProgress: tasks.filter(t => t.status === 'in_progress').length,
  }), [tasks]);

  const saveTask = (task) => {
    if (useSupabase && !canEditTasks) { alert('Редактировать задачи могут только владелец и редакторы.'); return; }
    setTasks(prev => {
      const idx = prev.findIndex(t => t.id === task.id);
      if (idx >= 0) { const n = [...prev]; n[idx] = task; return n; }
      return [...prev, task];
    });
  };

  const deleteTask = (id) => {
    if (useSupabase && !canEditTasks) { alert('Удалять задачи могут только владелец и редакторы.'); return; }
    if (confirm('Удалить задачу?')) setTasks(prev => prev.filter(t => t.id !== id));
  };

  const changeStatus = (id, status) => {
    if (useSupabase && !canEditTasks) return;
    setTasks(prev => prev.map(t => t.id === id ? {...t, status, updatedAt: new Date().toISOString()} : t));
  };

  const openNew = (status = 'todo') => { setEditingTask(null); setDefaultStatus(status); setModalOpen(true); };
  const openEdit = (task) => { setEditingTask(task); setDefaultStatus(task.status); setModalOpen(true); };

  const addMember = () => {
    if (!requireAdmin('добавление сотрудника')) return;
    if (!newName.trim()) return;
    const emojis = ['👤','👨‍💻','👩‍💻','👨‍🎨','👩‍🎨','🧑‍💼','👨‍🔧','👩‍🔬'];
    setMembers(prev => [...prev, { id: genId(), name: newName.trim(), avatar: emojis[Math.floor(Math.random()*emojis.length)], role: newRole.trim() || 'Участник' }]);
    setNewName(''); setNewRole('');
  };

  const removeMember = (id) => {
    if (!requireAdmin('удаление сотрудника')) return;
    if (confirm('Удалить участника?')) setMembers(prev => prev.filter(m => m.id !== id));
  };

  const updateMemberRole = (id, role) => {
    if (!requireAdmin('изменение роли')) return;
    setMembers(prev => prev.map(m => m.id === id ? {...m, role} : m));
  };

  const statuses = ['todo', 'in_progress', 'review', 'done'];

  return (
    <div>
      {/* Header */}
      <div className="header">
        <div className="header-inner">
          <div className="logo">
            <div className="logo-icon"><span>⚡</span></div>
            <div>
              <h1>TaskFlow</h1>
              <p>Управление задачами команды</p>
            </div>
          </div>
          <div className="stats">
            <div className="stat"><span className="stat-dot" style={{background:'#6366f1'}}></span>Всего: <b>{stats.total}</b></div>
            <div className="stat"><span className="stat-dot" style={{background:'#3b82f6'}}></span>В работе: <b>{stats.inProgress}</b></div>
            <div className="stat"><span className="stat-dot" style={{background:'#22c55e'}}></span>Готово: <b>{stats.done}</b></div>
            {stats.overdue > 0 && <div className="stat"><span className="stat-dot" style={{background:'#ef4444'}}></span><span style={{color:'#dc2626'}}>Просрочено: <b>{stats.overdue}</b></span></div>}
          </div>
          <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
            {loggedIn ? (
              <span className="user-badge">{isOwner ? '🛡️' : '👤'} {displayName}{isOwner ? ' (владелец)' : ''}</span>
            ) : null}
            {loggedIn ? (
              <button className="btn-secondary" onClick={logout}>Выйти</button>
            ) : (
              <button className="btn-secondary btn-login" onClick={() => { setLoginError(''); setAuthMode('login'); setLoginOpen(true); }}>🔐 {useSupabase ? 'Войти' : 'Войти как владелец'}</button>
            )}
            <button className="btn-secondary" onClick={() => setShowTeam(!showTeam)}>👥 Команда</button>
            {canEditTasks && <button className="btn-primary" onClick={() => openNew()}>+ <span style={{display:'inline'}}>Новая задача</span></button>}
          </div>
        </div>
      </div>

      {/* Доступ не выдан (режим Supabase): человек вошёл, но владелец ещё не одобрил */}
      {useSupabase && sbReady && sbUser && !approved && (
        <div className="modal-overlay" style={{zIndex: 70}}>
          <div className="modal-backdrop"></div>
          <div className="modal" style={{maxWidth:'420px', position:'relative', zIndex:70}}>
            <div className="modal-body" style={{textAlign:'center'}}>
              <div style={{fontSize:'48px', marginBottom:'12px'}}>{isPending ? '⏳' : '🔒'}</div>
              <h2 style={{marginBottom:'8px'}}>{isPending ? 'Доступ ещё не выдан' : 'Нужен вход в систему'}</h2>
              <p style={{color:'#6b7280', fontSize:'14px', marginBottom:'16px'}}>
                {isPending
                  ? <>Ваш аккаунт <b>{sbUser.email}</b> создан и отправлен владельцу приложения. Как только он выдаст вам доступ (роль «Сотрудник» или «Редактор»), страница обновится автоматически.</>
                  : 'Приложение закрыто паролем: данные видны только сотрудникам, которым владелец выдал доступ.'}
              </p>
              {isPending ? (
                <button className="btn-secondary" onClick={logout}>Выйти</button>
              ) : (
                <button className="btn-primary" onClick={() => { setLoginError(''); setAuthMode('login'); setLoginOpen(true); }}>🔐 Войти / зарегистрироваться</button>
              )}
            </div>
          </div>
        </div>
      )}

      {/* Team Panel */}
      {showTeam && (
        <div className="team-panel">
          <div className="team-panel-inner">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}}>
              <h3 style={{fontWeight:600}}>Команда {!isOwner && <span style={{fontSize:'12px',fontWeight:400,color:'#9ca3af'}}>(только просмотр — менять роли и сотрудников может только владелец)</span>}</h3>
              <button className="modal-close" onClick={() => setShowTeam(false)}>✕</button>
            </div>
            {!useSupabase && !ownerAccount && (
              <div className="admin-setup">
                <span>🛡️ Настройте аккаунт владельца (это можете сделать только вы):</span>
                <input value={setupName} onChange={e => setSetupName(e.target.value)} placeholder="Ваше имя" />
                <input type="password" value={setupPass} onChange={e => setSetupPass(e.target.value)} placeholder="Пароль" />
                <input type="password" value={setupPass2} onChange={e => setSetupPass2(e.target.value)} placeholder="Повторите пароль" onKeyDown={e => e.key === 'Enter' && setupAdmin()} />
                <button onClick={setupAdmin}>Создать владельца</button>
                {setupError && <span style={{color:'#dc2626'}}>{setupError}</span>}
              </div>
            )}
            <div className="team-members">
              {members.map(m => (
                <div key={m.id} className="member-chip">
                  <span>{m.avatar}</span>
                  <span style={{fontWeight:500}}>{m.name}</span>
                  {isOwner ? (
                    <input
                      value={m.role}
                      onChange={e => updateMemberRole(m.id, e.target.value)}
                      style={{width:'110px',padding:'2px 8px',border:'1px solid #e5e7eb',borderRadius:'8px',fontSize:'12px',outline:'none'}}
                      title="Изменить роль"
                    />
                  ) : (
                    <span style={{color:'#9ca3af',fontSize:'12px'}}>{m.role}</span>
                  )}
                  {isOwner && <button className="remove" onClick={() => removeMember(m.id)}>×</button>}
                </div>
              ))}
            </div>
            {isOwner ? (
              <div className="team-form">
                <input value={newName} onChange={e => setNewName(e.target.value)} placeholder="Имя" onKeyDown={e => e.key === 'Enter' && addMember()} />
                <input value={newRole} onChange={e => setNewRole(e.target.value)} placeholder="Роль" onKeyDown={e => e.key === 'Enter' && addMember()} />
                <button onClick={addMember}>Добавить</button>
              </div>
            ) : (
              <div style={{fontSize:'13px',color:'#9ca3af'}}>Добавлять, удалять сотрудников и менять их роли может только владелец. {!loggedIn && '🔐 Войдите, чтобы получить доступ.'}</div>
            )}
            {useSupabase && isOwner && profiles.length > 0 && (() => {
              const pendingList = profiles.filter(p => p.role === 'pending');
              const accessList = profiles.filter(p => p.id !== (sbUser && sbUser.id));
              return (
              <div style={{marginTop:'14px'}}>
                <h3 style={{fontWeight:600, fontSize:'14px', marginBottom:'8px'}}>
                  🔑 Доступ к приложению (аккаунты)
                  {pendingList.length > 0 && <span style={{marginLeft:'8px', background:'#fef3c7', color:'#b45309', borderRadius:'10px', padding:'2px 8px', fontSize:'11px'}}>ждут одобрения: {pendingList.length}</span>}
                </h3>
                {accessList.map(p => (
                  <div key={p.id} className="member-chip" style={{marginBottom:'6px'}}>
                    <span>{p.role === 'pending' ? '⏳' : p.role === 'editor' ? '✏️' : '👤'}</span>
                    <span style={{fontWeight:500}}>{p.name || (p.email || '').split('@')[0] || 'Участник'}</span>
                    {p.email && <span style={{color:'#9ca3af', fontSize:'11px'}}>{p.email}</span>}
                    <select
                      value={p.role}
                      onChange={e => changeUserRole(p.id, e.target.value)}
                      style={{padding:'2px 8px',border:'1px solid #e5e7eb',borderRadius:'8px',fontSize:'12px'}}
                      title="Права доступа"
                    >
                      <option value="pending">⛔ Нет доступа (ожидает)</option>
                      <option value="member">Сотрудник (просмотр задач)</option>
                      <option value="editor">Редактор (может менять задачи)</option>
                      <option value="owner">Владелец (полный доступ)</option>
                    </select>
                    <button className="remove" title="Отозвать доступ и удалить аккаунт" onClick={() => removeProfile(p.id, p.name || p.email)}>×</button>
                  </div>
                ))}
                <div style={{fontSize:'12px',color:'#9ca3af',marginTop:'6px'}}>
                  Новые регистрации попадают в статус «Нет доступа» — вы сами решаете, кого пустить.
                  Кнопка × отзывает доступ полностью. Свою роль владельца изменить нельзя (защита от самозапирания).
                </div>
              </div>
              );
            })()}
          </div>
        </div>
      )}

      {/* Filters */}
      <div className="filters">
        <div className="search-box">
          <input value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="Поиск задач..." />
        </div>
        <select className="filter-select" value={filterAssignee} onChange={e => setFilterAssignee(e.target.value)}>
          <option value="">Все исполнители</option>
          {members.map(m => <option key={m.id} value={m.id}>{m.avatar} {m.name}</option>)}
        </select>
        <select className="filter-select" value={filterPriority} onChange={e => setFilterPriority(e.target.value)}>
          <option value="">Все приоритеты</option>
          <option value="low">🟢 Низкий</option>
          <option value="medium">🔵 Средний</option>
          <option value="high">🟠 Высокий</option>
          <option value="urgent">🔴 Срочный</option>
        </select>
        <div className="view-toggle">
          <button className={viewMode === 'kanban' ? 'active' : ''} onClick={() => setViewMode('kanban')}>📊 Доска</button>
          <button className={viewMode === 'list' ? 'active' : ''} onClick={() => setViewMode('list')}>📋 Список</button>
        </div>
        {(filterAssignee || filterPriority || searchQuery) && (
          <button className="btn-secondary" onClick={() => { setFilterAssignee(''); setFilterPriority(''); setSearchQuery(''); }}>✕ Сбросить</button>
        )}
      </div>

      {/* Kanban View */}
      {viewMode === 'kanban' && (
        <div className="kanban">
          {statuses.map(status => {
            const cfg = STATUS_CONFIG[status];
            const colTasks = filtered.filter(t => t.status === status);
            return (
              <div key={status} className="column">
                <div className={`column-header ${cfg.colClass}`}>
                  <div className="column-header-left">
                    <span style={{fontSize:'18px'}}>{cfg.icon}</span>
                    <h2>{cfg.label}</h2>
                    <span className="column-count">{colTasks.length}</span>
                  </div>
                  <button className="column-add" onClick={() => openNew(status)}>+</button>
                </div>
                <div className="column-tasks">
                  {colTasks.length === 0 ? (
                    <div style={{textAlign:'center',padding:'30px 0',color:'#9ca3af'}}>
                      <div style={{fontSize:'30px',opacity:0.5,marginBottom:'8px'}}>📭</div>
                      <div style={{fontSize:'12px'}}>Нет задач</div>
                    </div>
                  ) : colTasks.map(task => {
                    const assignee = members.find(m => m.id === task.assignee);
                    const pCfg = PRIORITY_CONFIG[task.priority];
                    const overdue = task.status !== 'done' && isOverdue(task.deadline);
                    const dueSoon = task.status !== 'done' && isDueSoon(task.deadline);
                    return (
                      <div key={task.id} className={`task-card ${overdue ? 'overdue' : ''} ${dueSoon ? 'due-soon' : ''}`} onClick={() => openEdit(task)}>
                        <div className="task-actions">
                          <button onClick={e => { e.stopPropagation(); openEdit(task); }}>✏️</button>
                          <button onClick={e => { e.stopPropagation(); deleteTask(task.id); }}>🗑️</button>
                        </div>
                        <div className="task-title">{task.title}</div>
                        {task.description && <div className="task-desc">{task.description}</div>}
                        <div className="task-meta">
                          <span className={`badge ${pCfg.class}`}>
                            <span className="badge-dot"></span>{pCfg.label}
                          </span>
                          {task.deadline && (
                            <span className={`badge deadline-badge ${overdue ? 'overdue' : ''} ${dueSoon ? 'due-soon' : ''}`}>
                              {overdue ? '⚠️' : dueSoon ? '⏰' : '📅'} {formatDate(task.deadline)}
                            </span>
                          )}
                        </div>
                        <div className="task-footer">
                          {assignee ? (
                            <div className="task-assignee">
                              <span className="avatar">{assignee.avatar}</span>
                              <span className="name">{assignee.name}</span>
                            </div>
                          ) : (
                            <span style={{fontSize:'12px',color:'#9ca3af',fontStyle:'italic'}}>Не назначен</span>
                          )}
                          <div className="task-nav">
                            {task.status !== 'todo' && (
                              <button onClick={e => { e.stopPropagation(); const s = ['todo','in_progress','review','done']; const i = s.indexOf(task.status); if(i>0) changeStatus(task.id, s[i-1]); }}>◀</button>
                            )}
                            {task.status !== 'done' && (
                              <button onClick={e => { e.stopPropagation(); const s = ['todo','in_progress','review','done']; const i = s.indexOf(task.status); if(i<s.length-1) changeStatus(task.id, s[i+1]); }}>▶</button>
                            )}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* List View */}
      {viewMode === 'list' && (
        <div className="list-view">
          <div className="list-table">
            <table>
              <thead>
                <tr>
                  <th>Задача</th><th>Статус</th><th>Приоритет</th><th>Исполнитель</th><th>Дедлайн</th><th></th>
                </tr>
              </thead>
              <tbody>
                {filtered.length === 0 ? (
                  <tr><td colSpan="6" style={{textAlign:'center',padding:'40px',color:'#9ca3af'}}>📭 Задачи не найдены</td></tr>
                ) : filtered.map(task => {
                  const assignee = members.find(m => m.id === task.assignee);
                  const overdue = task.deadline && task.status !== 'done' && isOverdue(task.deadline);
                  return (
                    <tr key={task.id} onClick={() => openEdit(task)} style={overdue ? {background:'#fef2f2'} : {}}>
                      <td><div style={{fontWeight:500}}>{task.title}</div>{task.description && <div style={{fontSize:'12px',color:'#6b7280'}}>{task.description}</div>}</td>
                      <td>
                        <select value={task.status} onChange={e => { e.stopPropagation(); changeStatus(task.id, e.target.value); }} onClick={e => e.stopPropagation()} style={{fontSize:'12px',padding:'4px 8px',borderRadius:'8px',border:'1px solid #e5e7eb'}}>
                          <option value="todo">📋 К выполнению</option>
                          <option value="in_progress">🔄 В работе</option>
                          <option value="review">🔍 На проверке</option>
                          <option value="done">✅ Готово</option>
                        </select>
                      </td>
                      <td><span className={`badge ${PRIORITY_CONFIG[task.priority].class}`} style={{fontSize:'11px'}}>{task.priority === 'urgent' ? '🔴' : task.priority === 'high' ? '🟠' : task.priority === 'medium' ? '🔵' : '🟢'} {PRIORITY_CONFIG[task.priority].label}</span></td>
                      <td>{assignee ? `${assignee.avatar} ${assignee.name}` : <span style={{color:'#9ca3af'}}>—</span>}</td>
                      <td style={overdue ? {color:'#dc2626',fontWeight:500} : {}}>{task.deadline ? `${overdue ? '⚠️ ' : ''}${formatDate(task.deadline)}` : '—'}</td>
                      <td><button onClick={e => { e.stopPropagation(); deleteTask(task.id); }} style={{border:'none',background:'transparent',cursor:'pointer',fontSize:'14px'}}>🗑️</button></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* Empty State */}
      {tasks.length === 0 && (
        <div className="empty-state">
          <div className="empty-icon"><span>🚀</span></div>
          <h3>Добро пожаловать в TaskFlow!</h3>
          <p>Создайте свою первую задачу, назначьте исполнителя и установите дедлайн.</p>
          <button className="btn-primary" onClick={() => openNew()}>+ Создать первую задачу</button>
        </div>
      )}

      {/* Modal */}
      {modalOpen && <TaskModal task={editingTask} defaultStatus={defaultStatus} members={members} onClose={() => setModalOpen(false)} onSave={saveTask} />}

      {/* Login Modal */}
      {loginOpen && (
        <div className="modal-overlay" onClick={() => setLoginOpen(false)}>
          <div className="modal-backdrop"></div>
          <div className="modal" style={{maxWidth:'380px'}} onClick={e => e.stopPropagation()}>
            <div className="modal-body">
              <div className="modal-header">
                <h2>{useSupabase ? (authMode === 'login' ? '🔐 Вход' : '✨ Регистрация') : '🔐 Вход владельца'}</h2>
                <button className="modal-close" onClick={() => setLoginOpen(false)}>✕</button>
              </div>
              {useSupabase ? (
                <form onSubmit={e => { e.preventDefault(); authMode === 'login' ? doLogin() : doRegister(); }}>
                  {authMode === 'register' && (
                    <div className="form-group">
                      <label>Имя</label>
                      <input value={regName} onChange={e => setRegName(e.target.value)} placeholder="Как вас называть" autoFocus />
                    </div>
                  )}
                  <div className="form-group">
                    <label>Email</label>
                    <input type="email" value={loginName} onChange={e => setLoginName(e.target.value)} placeholder="you@company.com" autoFocus={authMode === 'login'} required />
                  </div>
                  <div className="form-group">
                    <label>Пароль</label>
                    <input type="password" value={loginPass} onChange={e => setLoginPass(e.target.value)} placeholder={authMode === 'register' ? 'Минимум 6 символов' : 'Пароль'} />
                  </div>
                  {loginError && <div className="form-hint" style={{color:'#dc2626',marginBottom:'8px'}}>⚠️ {loginError}</div>}
                  <div className="form-actions">
                    <button type="button" className="btn-cancel" onClick={() => setAuthMode(authMode === 'login' ? 'register' : 'login')}>
                      {authMode === 'login' ? 'Регистрация' : 'У меня есть аккаунт'}
                    </button>
                    <button type="submit" className="btn-save">{authMode === 'login' ? 'Войти' : 'Создать аккаунт'}</button>
                  </div>
                  {authMode === 'login' && (
                    <div style={{fontSize:'12px',color:'#9ca3af',marginTop:'10px'}}>
                      Приложение закрыто: доступ выдаёт только владелец. Зарегистрируйтесь — заявка попадёт ему на одобрение.
                    </div>
                  )}
                  {authMode === 'register' && (
                    <div style={{fontSize:'12px',color:'#9ca3af',marginTop:'10px'}}>
                      После регистрации аккаунт получит статус «ожидает» — владелец увидит его в панели «Команда → Доступ к приложению».
                    </div>
                  )}
                </form>
              ) : !ownerAccount ? (
                <p style={{fontSize:'14px',color:'#6b7280'}}>Аккаунт владельца ещё не создан. Откройте панель «👥 Команда» и настройте его.</p>
              ) : (
                <form onSubmit={e => { e.preventDefault(); doLogin(); }}>
                  <div className="form-group">
                    <label>Имя владельца</label>
                    <input value={loginName} onChange={e => setLoginName(e.target.value)} placeholder="Имя" autoFocus />
                  </div>
                  <div className="form-group">
                    <label>Пароль</label>
                    <input type="password" value={loginPass} onChange={e => setLoginPass(e.target.value)} placeholder="Пароль" />
                  </div>
                  {loginError && <div className="form-hint" style={{color:'#dc2626',marginBottom:'8px'}}>⚠️ {loginError}</div>}
                  <div className="form-actions">
                    <button type="button" className="btn-cancel" onClick={() => setLoginOpen(false)}>Отмена</button>
                    <button type="submit" className="btn-save">Войти</button>
                  </div>
                </form>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function TaskModal({ task, defaultStatus, members, onClose, onSave }) {
  const [title, setTitle] = useState(task?.title || '');
  const [description, setDescription] = useState(task?.description || '');
  const [status, setStatus] = useState(task?.status || defaultStatus);
  const [priority, setPriority] = useState(task?.priority || 'medium');
  const [assignee, setAssignee] = useState(task?.assignee || '');
  const [deadline, setDeadline] = useState(task?.deadline || '');

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!title.trim()) return;
    const now = new Date().toISOString();
    onSave({
      id: task?.id || genId(),
      title: title.trim(),
      description: description.trim(),
      status, priority, assignee, deadline,
      createdAt: task?.createdAt || now,
      updatedAt: now,
    });
    onClose();
  };

  const overdue = deadline && isOverdue(deadline);
  const dueSoon = deadline && isDueSoon(deadline);

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-backdrop"></div>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-body">
          <div className="modal-header">
            <h2>{task ? 'Редактировать задачу' : 'Новая задача'}</h2>
            <button className="modal-close" onClick={onClose}>✕</button>
          </div>
          <form onSubmit={handleSubmit}>
            <div className="form-group">
              <label>Название задачи *</label>
              <input value={title} onChange={e => setTitle(e.target.value)} placeholder="Введите название..." required autoFocus />
            </div>
            <div className="form-group">
              <label>Описание</label>
              <textarea value={description} onChange={e => setDescription(e.target.value)} placeholder="Опишите задачу..." rows="3" />
            </div>
            <div className="form-row">
              <div className="form-group">
                <label>Статус</label>
                <select value={status} onChange={e => setStatus(e.target.value)}>
                  <option value="todo">📋 К выполнению</option>
                  <option value="in_progress">🔄 В работе</option>
                  <option value="review">🔍 На проверке</option>
                  <option value="done">✅ Готово</option>
                </select>
              </div>
              <div className="form-group">
                <label>Приоритет</label>
                <select value={priority} onChange={e => setPriority(e.target.value)}>
                  <option value="low">🟢 Низкий</option>
                  <option value="medium">🔵 Средний</option>
                  <option value="high">🟠 Высокий</option>
                  <option value="urgent">🔴 Срочный</option>
                </select>
              </div>
            </div>
            <div className="form-group">
              <label>Исполнитель</label>
              <select value={assignee} onChange={e => setAssignee(e.target.value)}>
                <option value="">Не назначен</option>
                {members.map(m => <option key={m.id} value={m.id}>{m.avatar} {m.name} ({m.role})</option>)}
              </select>
            </div>
            <div className="form-group">
              <label>Дедлайн</label>
              <input type="date" value={deadline} onChange={e => setDeadline(e.target.value)} />
              {deadline && (
                <div className={`form-hint ${overdue ? 'color:#dc2626' : dueSoon ? 'color:#d97706' : 'color:#6b7280'}`}>
                  {overdue ? '⚠️ Просрочено!' : dueSoon ? '⏰ Скоро дедлайн!' : '📅 В срок'}
                </div>
              )}
            </div>
            <div className="form-actions">
              <button type="button" className="btn-cancel" onClick={onClose}>Отмена</button>
              <button type="submit" className="btn-save">{task ? 'Сохранить' : 'Создать'}</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
